name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Novejši zagon na isti veji prekine starejšega (deploy na main se nikoli ne prekine sredi namestitve).
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: 24
  BACKEND_IMAGE: backtester-backend

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Namestitev odvisnosti
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Lint backend (oxlint)
        working-directory: backend
        run: npm run lint

      - name: Lint frontend (oxlint)
        working-directory: frontend
        run: npm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Namestitev odvisnosti
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Preverjanje tipov backenda
        working-directory: backend
        run: npm run typecheck

      # Frontend: URL backenda (repo spremenljivka VITE_API_URL) in pot na GitHub Pages se vgradita ob gradnji.
      - name: Build frontenda
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Artefakt frontend-dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

      # Backend: produkcijska Docker slika (koda, odvisnosti, migracije in cenovni podatki).
      - uses: docker/setup-buildx-action@v3

      - name: Build Docker slike backenda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.deploy
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/backend-image.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Artefakt backend-image
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: ${{ runner.temp }}/backend-image.tar
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: backtester
          POSTGRES_PASSWORD: test
          POSTGRES_DB: backtester
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backtester -d backtester"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://backtester:test@localhost:5432/backtester

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Namestitev odvisnosti
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Testi backenda s pokritostjo (node --test)
        working-directory: backend
        run: npm run test:coverage

      - name: Testi frontenda s pokritostjo (Vitest)
        working-directory: frontend
        run: npm run test:coverage

      - name: Artefakt coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage
            frontend/coverage
          retention-days: 14

  deploy:
    name: deploy
    needs: [lint, build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.pages.outputs.page_url }}
    permissions:
      contents: read
      packages: write # objava slike v GitHub Container Registry
      pages: write # objava frontenda na GitHub Pages
      id-token: write
    steps:
      - name: Prenos artefaktov iz joba build
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Backend: slika iz joba build se objavi v GHCR, Render jo prek deploy hooka namesti.
      - name: Objava slike backenda v GHCR
        id: image
        run: |
          docker load --input artifacts/backend-image/backend-image.tar
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${BACKEND_IMAGE}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "${BACKEND_IMAGE}:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "${BACKEND_IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "ref=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Namestitev backenda na Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL v okolju production ni nastavljen"
            exit 1
          fi
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&imgURL=$(jq -rn --arg v "$IMAGE_REF" '$v|@uri')"
          echo

      # Frontend: dist iz joba build se objavi na GitHub Pages (brez ponovne gradnje).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/frontend-dist

      - name: Namestitev frontenda na GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - name: Preverjanje nameščenega backenda
        env:
          BACKEND_URL: ${{ vars.VITE_API_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${BACKEND_URL%/}/api/health"; then echo; exit 0; fi
            echo "Backend še ni dosegljiv, poskus $i/30"; sleep 10
          done
          echo "::error::Backend ni dosegljiv na ${BACKEND_URL}"
          exit 1
